name: Validate Projects
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests-and-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts --prefix functions
      - run: npm test
      - run: npx --yes firebase-tools@15.10.1 emulators:exec --project demo-d2-project-audit --config firebase.emulators.json --only firestore "npm run test:rules"
